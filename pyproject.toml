[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qbr-insight-agent"
version = "0.1.0"
description = "Auditable QBR PowerPoint ingestion and evidence-first question answering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "langchain-openai==1.4.2",
  "langgraph==1.2.10",
  "openai==2.53.0",
  "pydantic==2.11.7",
  "PyYAML>=6.0,<7",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
vector = [
  "faiss-cpu>=1.10,<2",
  "numpy>=1.26,<3",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[project.scripts]
qbr-api = "apps.api.main:run"
qbr-worker = "apps.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["skills/extract-ppt-chart-data/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
